name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Vagaro can rename a profile without anything changing in this repo, which
  # is how every Book button once ended up on a 404. Check weekly regardless.
  schedule:
    - cron: "0 13 * * 1" # Mondays, 9am Eastern
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run check:links
